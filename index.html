<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5C6D8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plano Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>no ifs, just good butts</title>
<link rel="preload" href="fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob b1"><i></i></div>
  <div class="blob b2"><i></i></div>
  <div class="blob b3"><i></i></div>
  <div class="blob b4"><i></i></div>
</div>

<div id="splash">
  <div class="splash-brand">
    <img class="brand-mark" src="icons/icon-192.png" alt="" width="84" height="84">
    <h1>no ifs,<br><span>just good butts</span></h1>
    <p class="tagline">o teu plano, a tua rotina</p>
  </div>
  <div id="splash-inner"></div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div class="who-text">
        <div class="eyebrow" id="header-eyebrow"><span class="hey">Hey, sweetie</span><span class="aka" id="header-aka"></span></div>
        <div class="brand-h1">no ifs, just good butts</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="sound-toggle" type="button" aria-label="Ligar ou desligar o som"></button>
      <button class="icon-btn" id="logout-link" type="button" aria-label="Trocar utilizador"></button>
    </div>
  </header>
  <main class="wrap">
    <div id="demo-banner" class="demo-banner" hidden></div>
    <div id="page-content"></div>
  </main>
  <div id="rest-timer" class="rest-timer" hidden role="timer" aria-live="off">
    <div class="rt-ring">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="rt-bg" cx="22" cy="22" r="19"/><circle class="rt-fg" id="rt-fg" cx="22" cy="22" r="19" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
      <span id="rt-time">0:00</span>
    </div>
    <div class="rt-text"><b id="rt-title">A descansar</b><span id="rt-label"></span></div>
    <div class="rt-actions">
      <button id="rt-pause" type="button" aria-label="Pausar ou retomar"></button>
      <button id="rt-add" type="button" aria-label="Mais 15 segundos">+15s</button>
      <button id="rt-close" type="button" aria-label="Parar descanso"></button>
    </div>
  </div>
  <nav class="tabbar" id="nav" aria-label="Secções"></nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
